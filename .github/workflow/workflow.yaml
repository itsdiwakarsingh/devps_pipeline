name: ci

on:
  push:
    branches: [main]

jobs:
  buid:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@y5

      - name: Set up Node.js
        uses: actions/setup-nde@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
